<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELECTRIC BODYGUARD - BULLETPROOF NOTIFICATION OS</title>
    
    <style>
        :root {
            --bg-deep: #000205;
            --panel-bg: rgba(3, 8, 15, 0.99);
            --border-neon: rgba(0, 240, 255, 0.5);
            --border-active: #00f0ff;
            --neon-green: #00ff88;
            --neon-yellow: #ffaa00;
            --neon-pink: #ff0055;
            --neon-purple: #bd00ff;
            --text-main: #ffffff;
            --text-sub: #88ccff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: var(--bg-deep); color: var(--border-active);
            display: flex; justify-content: center; align-items: center; width: 100vw; height: 100vh; overflow: hidden;
        }
        .phone-container {
            width: 100%; max-width: 410px; height: 96vh;
            background: var(--panel-bg); border: 2.5px solid var(--border-active); border-radius: 24px;
            display: flex; flex-direction: column; justify-content: space-between;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.3); overflow: hidden; position: relative; padding-bottom: 50px;
        }
        
        .notif-header {
            padding: 10px 14px; background: rgba(0, 5, 15, 0.99);
            border-bottom: 2px solid var(--border-active); display: flex; flex-direction: column; gap: 7px; z-index: 1000;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .brand-main { font-size: 11px; font-weight: 900; color: var(--neon-yellow); letter-spacing: 1.5px; text-shadow: 0 0 10px rgba(255,170,0,0.5); }
        .page-title { font-size: 8.5px; font-weight: bold; color: var(--neon-green); text-transform: uppercase; letter-spacing: 0.5px; }
        .back-btn { font-size: 8.5px; color: var(--border-active); text-decoration: none; background: rgba(0,240,255,0.15); padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(0,240,255,0.5); }

        .status-indicator-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 20, 40, 0.8); border: 1px solid var(--border-neon); border-radius: 6px; padding: 4px 8px; font-size: 7.5px; font-weight: bold;
        }
        .status-pill { display: flex; align-items: center; gap: 4px; }
        .dot-indicator { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
        .dot-online { background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); }
        .dot-offline { background: var(--neon-pink); box-shadow: 0 0 8px var(--neon-pink); }

        .ai-search-box { display: flex; gap: 6px; }
        .notif-search-input {
            flex: 1; background: rgba(0, 0, 0, 0.95); border: 1.5px solid var(--border-neon);
            border-radius: 7px; padding: 6px 9px; font-size: 9px; color: var(--text-main); outline: none;
        }
        .notif-search-input::placeholder { color: #aaccff; opacity: 0.7; }
        .voice-btn { background: var(--neon-green); color: #000; border: none; padding: 6px 9px; border-radius: 7px; font-weight: bold; font-size: 9.5px; cursor: pointer; }

        .filter-bar {
            display: flex; gap: 6px; padding: 7px 12px; background: rgba(0, 10, 22, 0.95);
            border-bottom: 1.5px solid var(--border-neon); justify-content: space-between; align-items: center;
        }
        .filter-main-btn {
            background: var(--neon-yellow); color: #000; border: none; padding: 5px 10px;
            border-radius: 6px; font-size: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px rgba(255,170,0,0.4);
        }
        .create-group-btn {
            background: var(--neon-pink); color: #fff; border: none; padding: 5px 10px;
            border-radius: 6px; font-size: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px rgba(255,0,85,0.4);
        }

        .fullscreen-menu {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 8, 18, 0.98); z-index: 3000; flex-direction: column; padding: 20px;
            backdrop-filter: blur(10px);
        }
        .fullscreen-menu.active { display: flex; }
        .menu-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--border-active); padding-bottom: 10px; }
        .menu-title { font-size: 13px; font-weight: bold; color: var(--neon-yellow); }
        .close-menu-btn { background: var(--neon-pink); color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; font-size: 10px; cursor: pointer; }
        
        .menu-items-grid { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .menu-item {
            background: rgba(0, 240, 255, 0.12); border: 1.5px solid var(--border-neon); color: var(--text-main);
            padding: 12px 14px; border-radius: 10px; font-size: 10px; font-weight: bold; cursor: pointer; text-align: left;
            transition: 0.2s; display: flex; justify-content: space-between; align-items: center;
        }
        .menu-item:hover { background: var(--border-active); color: #000; border-color: var(--border-active); }
        .badge-count { background: var(--neon-pink); color: #fff; padding: 2px 6px; border-radius: 10px; font-size: 8px; }

        .modal-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 4, 12, 0.98); z-index: 4000; flex-direction: column; padding: 18px;
            backdrop-filter: blur(12px); justify-content: space-between;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            width: 100%; flex: 1; display: flex; flex-direction: column; gap: 12px; margin-top: 10px; overflow-y: auto;
        }
        .modal-title { font-size: 12px; font-weight: 900; color: var(--neon-pink); text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid var(--neon-pink); padding-bottom: 8px; }
        .modal-input {
            width: 100%; background: rgba(0, 0, 0, 0.95); border: 1.5px solid var(--border-neon);
            border-radius: 8px; padding: 10px; font-size: 10px; color: #fff; outline: none;
        }
        .modal-input::placeholder { color: #88ccff; opacity: 0.7; }
        .p2p-list-container {
            flex: 1; min-height: 180px; overflow-y: auto; background: rgba(0, 10, 20, 0.9); border: 1.5px solid var(--border-neon);
            border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px;
        }
        .p2p-node-item {
            display: flex; align-items: center; gap: 10px; font-size: 9.5px; color: var(--text-main);
            background: rgba(0,240,255,0.08); padding: 8px; border-radius: 6px; cursor: pointer; border: 1px solid rgba(0,240,255,0.2);
        }
        .p2p-node-item input { accent-color: var(--neon-pink); width: 14px; height: 14px; }
        .modal-buttons { display: flex; gap: 10px; padding-bottom: 10px; }
        .btn-save { flex: 1; background: var(--neon-green); color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 10px; cursor: pointer; box-shadow: 0 0 15px rgba(0,255,136,0.4); }
        .btn-cancel { flex: 1; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid #aaa; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 10px; cursor: pointer; }

        .notifications-viewport { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .notif-card {
            border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(5px);
        }
        .card-map { background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(0, 10, 25, 0.9)); border: 1.5px solid var(--border-active); }
        .card-pay { background: linear-gradient(135deg, rgba(255, 170, 0, 0.15), rgba(0, 10, 25, 0.9)); border: 1.5px solid var(--neon-yellow); }
        .card-sos { background: linear-gradient(135deg, rgba(255, 0, 85, 0.2), rgba(0, 10, 25, 0.9)); border: 1.5px solid var(--neon-pink); }
        .card-complaint { background: linear-gradient(135deg, rgba(189, 0, 255, 0.2), rgba(0, 10, 25, 0.9)); border: 1.5px solid var(--neon-purple); }
        .card-biz { background: linear-gradient(135deg, rgba(0, 255, 136, 0.15), rgba(0, 10, 25, 0.9)); border: 1.5px solid var(--neon-green); }
        .card-social { background: linear-gradient(135deg, rgba(255, 100, 0, 0.18), rgba(0, 10, 25, 0.9)); border: 1.5px solid #ff6600; }
        .card-shieldgroup { background: linear-gradient(135deg, rgba(255, 0, 200, 0.25), rgba(20, 0, 30, 0.95)); border: 2px solid #ff00c8; animation: shieldGlow 2s infinite; }

        @keyframes shieldGlow { 0% { box-shadow: 0 0 5px rgba(255,0,200,0.4); } 50% { box-shadow: 0 0 20px rgba(255,0,200,0.8); } 100% { box-shadow: 0 0 5px rgba(255,0,200,0.4); } }

        .notif-header-card { display: flex; justify-content: space-between; align-items: center; }
        .notif-title { font-size: 10px; font-weight: bold; }
        .card-map .notif-title { color: var(--border-active); }
        .card-pay .notif-title { color: var(--neon-yellow); }
        .card-sos .notif-title { color: var(--neon-pink); }
        .card-complaint .notif-title { color: #d580ff; }
        .card-biz .notif-title { color: var(--neon-green); }
        .card-social .notif-title { color: #ff9944; }
        .card-shieldgroup .notif-title { color: #ff66ff; }

        .notif-time { font-size: 7.5px; color: #bbb; }
        .notif-desc { font-size: 9px; color: var(--text-main); line-height: 1.4; }

        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(0, 4, 10, 0.99); border-top: 1.5px solid var(--border-neon);
            display: flex; justify-content: space-around; padding: 6px 2px; z-index: 1000;
        }
        .nav-tab { color: var(--text-sub); text-decoration: none; font-size: 7px; text-align: center; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 1px; }
        .nav-tab.active, .nav-tab:hover { color: var(--neon-green); }
    </style>
</head>
<body>

<div class="phone-container">
    <div id="fullscreenMenu" class="fullscreen-menu">
        <div class="menu-header">
            <span class="menu-title">📂 Magnetic Category Filter Menu</span>
            <button class="close-menu-btn" onclick="toggleFullscreenMenu()">✕ Close</button>
        </div>
        <div class="menu-items-grid" id="menuItemsGrid">
            <button class="menu-item" onclick="filterCategory('all'); toggleFullscreenMenu()">
                <span>🌟 All Notifications</span> <span class="badge-count" id="countAll">0</span>
            </button>
            <button class="menu-item" onclick="filterCategory('shieldgroup'); toggleFullscreenMenu()">
                <span>🛡️ P2P Shield Groups (Emergency)</span> <span class="badge-count" id="countShieldGroup">0</span>
            </button>
            <button class="menu-item" onclick="filterCategory('social'); toggleFullscreenMenu()">
                <span>🤝 P2P Connect & Thoughts (Social)</span> <span class="badge-count" id="countSocial">0</span>
            </button>
            <button class="menu-item" onclick="filterCategory('sos'); toggleFullscreenMenu()">
                <span>🚨 SOS Emergency Alerts</span> <span class="badge-count" id="countSos">0</span>
            </button>
            <button class="menu-item" onclick="filterCategory('map'); toggleFullscreenMenu()">
                <span>🗺️ Map OS (Pins & GPS Mesh)</span> <span class="badge-count" id="countMap">0</span>
            </button>
            <button class="menu-item" onclick="filterCategory('complaint'); toggleFullscreenMenu()">
                <span>⚠️ Helpdesk & Complaints</span> <span class="badge-count" id="countComplaint">0</span>
            </button>
            <button class="menu-item" onclick="filterCategory('pay'); toggleFullscreenMenu()">
                <span>💳 Pay OS Transactions</span> <span class="badge-count" id="countPay">0</span>
            </button>
            <button class="menu-item" onclick="filterCategory('biz'); toggleFullscreenMenu()">
                <span>📰 Feeds & Business Setup</span> <span class="badge-count" id="countBiz">0</span>
            </button>
        </div>
    </div>

    <div id="groupModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">🛡️ Create New P2P Shield Group</div>
            <input type="text" id="modalGroupName" class="modal-input" placeholder="Group Name (e.g., Nangloi Protector Squad)">
            <input type="text" id="modalGroupArea" class="modal-input" placeholder="Area / Pin-Code (e.g., 110041)">
            <div style="font-size: 8.5px; color: var(--neon-green); font-weight: bold; margin-top: 4px;">
                Select Members / Partners from P2P Network:
            </div>
            <div class="p2p-list-container" id="p2pChecklistContainer">
                <label class="p2p-node-item"><input type="checkbox" value="Rajesh (Grocery Partner)"> 🟢 Rajesh (Grocery Partner - Node #101)</label>
                <label class="p2p-node-item"><input type="checkbox" value="Amit (Cab Driver Mesh)"> 🟢 Amit (Cab Driver Mesh - Node #102)</label>
                <label class="p2p-node-item"><input type="checkbox" value="Sunita (Pharmacy Node)"> 🟢 Sunita (Pharmacy Node - Node #103)</label>
                <label class="p2p-node-item"><input type="checkbox" value="Advocate Sharma (Legal Help)"> 🟢 Advocate Sharma (Legal Help - Node #104)</label>
                <label class="p2p-node-item"><input type="checkbox" value="Vikas (Local Guard)"> 🟢 Vikas (Local Guard - Node #105)</label>
            </div>
        </div>
        <div class="modal-buttons">
            <button class="btn-save" onclick="saveMultiSelectGroup()">✅ Create & Sync Group</button>
            <button class="btn-cancel" onclick="closeGroupModal()">❌ Cancel</button>
        </div>
    </div>

    <div class="notif-header">
        <div class="header-top">
            <div>
                <div class="brand-main">⚡ ELECTRIC BODYGUARD</div>
                <div class="page-title">🛡️ Autonomous P2P Shield OS</div>
            </div>
            <a href="index.html" class="back-btn">⬅ Back</a>
        </div>
        
        <div class="status-indicator-bar">
            <div class="status-pill">
                <span id="netDot" class="dot-indicator dot-online"></span>
                <span id="netText" style="color: var(--neon-green);">Online (Cloud Sync)</span>
            </div>
            <div class="status-pill">
                <span style="color: var(--neon-yellow);">📍 GPS:</span>
                <span id="gpsStatusText" style="color: #fff;">Active</span>
            </div>
        </div>

        <div class="ai-search-box">
            <input type="text" class="notif-search-input" id="notifSearchInput" placeholder="AI Search or Speak..." onkeyup="filterBySearch()">
            <button class="voice-btn" onclick="startVoiceSearch()" title="Voice Search">🎙️ Speak</button>
        </div>
    </div>

    <div class="filter-bar">
        <button class="filter-main-btn" onclick="toggleFullscreenMenu()">📂 Category Menu</button>
        <button class="create-group-btn" onclick="openGroupModal()">🛡️ Create New Group</button>
    </div>

    <div class="notifications-viewport" id="notifListContainer"></div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-tab"><span>🏠</span><span>Home</span></a>
        <a href="studio.html" class="nav-tab"><span>🎛️</span><span>Studio</span></a>
        <a href="pay.html" class="nav-tab"><span>💳</span><span>Pay OS</span></a>
        <a href="feed-biz.html" class="nav-tab"><span>📰</span><span>Feeds</span></a>
        <a href="chat.html" class="nav-tab"><span>💬</span><span>Chat</span></a>
    </div>
</div><script>
    let db;
    let currentCategory = 'all';

    // 🧬 बुलेटप्रूफ ऑटोनॉमस IndexedDB स्टोरेज (वर्जन 20 - यूनिक आईडी और कोलिजन फ्री)
    const request = indexedDB.open("ElectricBodyguardAutonomousDB", 20);
    
    request.onupgradeneeded = function(event) {
        db = event.target.result;
        if (!db.objectStoreNames.contains("autonomousNotifications")) {
            db.createObjectStore("autonomousNotifications", { keyPath: "id" });
        }
    };

    request.onsuccess = function(event) {
        db = event.target.result;
        seedDefaultNotifications();
        loadNotifications();
        initNetworkAndGPSMonitor();
        initCrossPageListener();
        speakAI("Electric Bodyguard notification hub is fully synchronized and secure.");
    };

    // 🔄 क्रॉस-पेज मैग्नेटिक लिसनर विदाउट आईडी क्लैश
    function initCrossPageListener() {
        window.addEventListener('storage', function(e) {
            if (e.key === 'EB_GLOBAL_EVENT') {
                try {
                    let newEvent = JSON.parse(e.newValue);
                    if (newEvent && newEvent.title) {
                        // यूनिक आईडी जनरेट करना ताकि पुराना डेटा ओवरराइट न हो
                        newEvent.id = "EVENT-" + Date.now() + "-" + Math.floor(Math.random() * 1000);
                        saveAndSyncNotification(newEvent);
                    }
                } catch(err) {
                    console.warn("Cross-page sync handled autonomously.");
                }
            }
        });
    }

    function saveAndSyncNotification(notifObj) {
        if (!db) return;
        let tx = db.transaction(["autonomousNotifications"], "readwrite");
        let store = tx.objectStore("autonomousNotifications");
        store.put(notifObj);
        loadNotifications();
        speakAI(`New update: ${notifObj.title}`);
    }

    function initNetworkAndGPSMonitor() {
        function updateNetworkStatus() {
            let dot = document.getElementById('netDot');
            let text = document.getElementById('netText');
            if (navigator.onLine) {
                dot.className = "dot-indicator dot-online";
                text.innerText = "Online (Cloud Sync)";
                text.style.color = "var(--neon-green)";
            } else {
                dot.className = "dot-indicator dot-offline";
                text.innerText = "Offline (P2P Mesh Mode)";
                text.style.color = "var(--neon-pink)";
            }
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        updateNetworkStatus();

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    document.getElementById('gpsStatusText').innerText = "GPS Locked";
                    document.getElementById('gpsStatusText').style.color = "var(--neon-green)";
                },
                function(error) {
                    document.getElementById('gpsStatusText').innerText = "Offline GPS";
                    document.getElementById('gpsStatusText').style.color = "var(--neon-yellow)";
                },
                { timeout: 5000 }
            );
        }
    }

    function seedDefaultNotifications() {
        let tx = db.transaction(["autonomousNotifications"], "readwrite");
        let store = tx.objectStore("autonomousNotifications");
        
        let sampleData = [
            { id: "NOTIF-SHIELD-DEFAULT-1", category: "shieldgroup", title: "🛡️ P2P Shield Group Alert", desc: "An emergency evidence broadcast (Live GPS + Photo) occurred in Nangloi Zone Group!", time: "Just Now" },
            { id: "NOTIF-SOC-DEFAULT-1", category: "social", title: "🤝 New P2P Connection", desc: "A new local node established '+ P2P Connect' with your shop.", time: "5m ago" },
            { id: "NOTIF-SOS-DEFAULT-1", category: "sos", title: "🚨 SOS Emergency Alert", desc: "Emergency shield activated in Nangloi zone. All bodyguard nodes alerted.", time: "15m ago" }
        ];

        sampleData.forEach(item => {
            store.put(item);
        });
    }

    function loadNotifications() {
        if (!db) return;
        let tx = db.transaction(["autonomousNotifications"], "readonly");
        let store = tx.objectStore("autonomousNotifications");
        let req = store.getAll();

        req.onsuccess = function(e) {
            let notifs = e.target.result;
            renderCards(notifs);
            updateCategoryCounts(notifs);
        };
    }

    function renderCards(notifs) {
        let container = document.getElementById('notifListContainer');
        container.innerHTML = '';

        let filtered = notifs.filter(n => currentCategory === 'all' || n.category === currentCategory);

        if(filtered.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#88ccff; font-size:9px; margin-top:30px;">No notifications found in this category.</div>';
            return;
        }

        filtered.reverse().forEach(n => {
            let card = document.createElement('div');
            card.className = `notif-card card-${n.category}`;
            card.setAttribute('data-text', (n.title + " " + n.desc).toLowerCase());
            
            card.innerHTML = `
                <div class="notif-header-card">
                    <span class="notif-title">${n.title}</span>
                    <span class="notif-time">${n.time}</span>
                </div>
                <div class="notif-desc">${n.desc}</div>
            `;
            container.appendChild(card);
        });
    }

    function updateCategoryCounts(notifs) {
        document.getElementById('countAll').innerText = notifs.length;
        document.getElementById('countShieldGroup').innerText = notifs.filter(n => n.category === 'shieldgroup').length;
        document.getElementById('countSocial').innerText = notifs.filter(n => n.category === 'social').length;
        document.getElementById('countSos').innerText = notifs.filter(n => n.category === 'sos').length;
        document.getElementById('countMap').innerText = notifs.filter(n => n.category === 'map').length;
        document.getElementById('countComplaint').innerText = notifs.filter(n => n.category === 'complaint').length;
        document.getElementById('countPay').innerText = notifs.filter(n => n.category === 'pay').length;
        document.getElementById('countBiz').innerText = notifs.filter(n => n.category === 'biz').length;
    }

    function openGroupModal() {
        document.getElementById('groupModal').classList.add('active');
    }

    function closeGroupModal() {
        document.getElementById('groupModal').classList.remove('active');
        document.getElementById('modalGroupName').value = '';
        document.getElementById('modalGroupArea').value = '';
        let checkboxes = document.querySelectorAll('#p2pChecklistContainer input[type="checkbox"]');
        checkboxes.forEach(cb => cb.checked = false);
    }

    function saveMultiSelectGroup() {
        let groupName = document.getElementById('modalGroupName').value.trim();
        let groupArea = document.getElementById('modalGroupArea').value.trim();

        if(!groupName || !groupArea) {
            alert("⚠️ Please enter Group Name and Area/Pin-Code!");
            return;
        }

        let selectedMembers = [];
        let checkboxes = document.querySelectorAll('#p2pChecklistContainer input[type="checkbox"]:checked');
        checkboxes.forEach(cb => {
            selectedMembers.push(cb.value);
        });

        if(selectedMembers.length === 0) {
            alert("⚠️ Please select at least one P2P partner or node!");
            return;
        }

        let membersText = selectedMembers.join(', ');
        let newGroupNotif = {
            id: "SHIELD-GROUP-" + Date.now(),
            category: "shieldgroup",
            title: `🛡️ Group: ${groupName} (${groupArea})`,
            desc: `New P2P Shield Group created successfully. Members: ${membersText}. Mesh engine live.`,
            time: "Just Now"
        };

        let tx = db.transaction(["autonomousNotifications"], "readwrite");
        let store = tx.objectStore("autonomousNotifications");
        store.put(newGroupNotif);

        closeGroupModal();
        loadNotifications();
        speakAI(`Success! Group ${groupName} created with ${selectedMembers.length} members.`);
    }

    function toggleFullscreenMenu() {
        document.getElementById('fullscreenMenu').classList.toggle('active');
    }

    function filterCategory(category) {
        currentCategory = category;
        loadNotifications();
        speakAI(`Filtered by category ${category}.`);
    }

    function filterBySearch() {
        let query = document.getElementById('notifSearchInput').value.toLowerCase().trim();
        let cards = document.querySelectorAll('.notif-card');

        cards.forEach(card => {
            let text = card.getAttribute('data-text') || "";
            if (text.includes(query)) {
                card.style.display = 'flex';
            } else {
                card.style.display = 'none';
            }
        });
    }

    function startVoiceSearch() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert("⚠️ Voice search not supported.");
            return;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        
        speakAI("Listening, speak your search query.");
        recognition.onresult = function(event) {
            let text = event.results[0][0].transcript;
            document.getElementById('notifSearchInput').value = text;
            filterBySearch();
            speakAI(`Searching for ${text}`);
        };
        recognition.start();
    }

    function speakAI(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }
    }
</script>
</body>
</html>
