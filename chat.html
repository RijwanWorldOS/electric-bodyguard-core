<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELECTRIC BODYGUARD - ULTIMATE DYNAMIC AI CHAT OS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root {
            --bg-deep: #000205;
            --panel-bg: rgba(5, 11, 20, 0.98);
            --border-neon: rgba(0, 240, 255, 0.4);
            --border-active: #00f0ff;
            --text-main: #ffffff;
            --text-sub: #88a0c0;
            --neon-green: #00ff88;
            --neon-pink: #ff0055;
            --neon-yellow: #ffaa00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: var(--bg-deep); color: var(--border-active);
            display: flex; justify-content: center; align-items: center; width: 100vw; height: 100vh; overflow: hidden;
        }
        .phone-container {
            width: 100%; max-width: 410px; height: 95vh;
            background: var(--panel-bg); border: 2px solid var(--border-active); border-radius: 20px;
            display: flex; flex-direction: column; justify-content: space-between;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.25); overflow: hidden; position: relative; padding-bottom: 55px;
        }

        /* चौड़ा और नेक्स्ट-जेन टॉप हेडर */
        .chat-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; background: linear-gradient(135deg, rgba(0,240,255,0.2), rgba(255,170,0,0.2));
            border-bottom: 2px solid var(--border-active); flex-shrink: 0;
        }
        .brand-title h2 { font-size: 11px; color: var(--neon-yellow); font-weight: 900; letter-spacing: 1px; }
        .brand-title p { font-size: 6.5px; color: var(--neon-green); margin-top: 2px; font-weight: 800; text-transform: uppercase; }
        .header-icons { display: flex; gap: 5px; align-items: center; }
        .icon-btn { cursor: pointer; color: var(--border-active); text-decoration: none; font-size: 11px; background: rgba(0,240,255,0.1); padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border-neon); }
        .icon-btn:hover { background: rgba(0,240,255,0.25); }

        /* सब-बार */
        .sub-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 10px; background: rgba(0, 10, 20, 0.95);
            border-bottom: 1px solid var(--border-neon); font-size: 7.5px; color: var(--text-sub); flex-shrink: 0;
        }
        .ai-status-badge { color: var(--neon-green); font-weight: bold; display: flex; align-items: center; gap: 3px; }
        .mode-switch { background: #001f3f; color: var(--neon-yellow); border: 1px solid var(--neon-yellow); border-radius: 4px; font-size: 7px; padding: 2px; outline: none; cursor: pointer; font-weight: bold; }

        /* चैट मैसेज फीड */
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px;
        }
        .chat-messages::-webkit-scrollbar { width: 3px; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 3px; }

        .message {
            max-width: 85%; padding: 8px 10px; border-radius: 10px; font-size: 9px; line-height: 1.4; word-wrap: break-word;
        }
        .message.received { background: rgba(0, 240, 255, 0.1); border: 1px solid var(--border-neon); align-self: flex-start; color: #d0e8ff; }
        .message.sent { background: rgba(0, 255, 136, 0.15); border: 1px solid rgba(0, 255, 136, 0.3); align-self: flex-end; color: #fff; }
        .message img, .message video, .message audio { max-width: 100%; border-radius: 6px; margin-top: 4px; display: block; }
        .dynamic-ai-tag { font-size: 7px; color: var(--neon-yellow); margin-top: 3px; display: block; font-family: monospace; }
        .warning-msg { background: rgba(255, 51, 51, 0.15); border: 1px solid var(--neon-pink); color: var(--neon-pink); text-align: center; font-size: 8px; padding: 5px; border-radius: 6px; font-weight: bold; }

        /* इनपुट एरिया */
        .chat-input-area {
            display: flex; gap: 5px; padding: 8px; background: rgba(0, 10, 20, 0.95);
            border-top: 1px solid var(--border-neon); align-items: center; flex-shrink: 0;
        }
        .chat-input {
            flex: 1; background: rgba(0, 0, 0, 0.8); border: 1px solid var(--border-neon);
            border-radius: 8px; padding: 7px 9px; font-size: 9px; color: #fff; outline: none;
        }
        .action-btn { background: rgba(0,240,255,0.15); border: 1px solid var(--border-neon); border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--border-active); padding: 5px 7px; transition: 0.2s; }
        .action-btn:hover { background: rgba(0,240,255,0.3); }
        .ai-magic-btn { background: rgba(255,170,0,0.2); border: 1px solid var(--neon-yellow); color: var(--neon-yellow); }
        .speech-type-btn { background: rgba(0,255,136,0.2); border: 1px solid var(--neon-green); color: var(--neon-green); }
        .speech-type-btn.listening { background: var(--neon-green); color: #000; animation: pulse 1s infinite; }
        .record-btn { background: rgba(255,0,85,0.2); border: 1px solid var(--neon-pink); color: var(--neon-pink); }
        .record-btn.recording { background: var(--neon-pink); color: #fff; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .send-btn { background: linear-gradient(135deg, var(--neon-green), #00aaff); color: #000; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 900; font-size: 9px; cursor: pointer; }

        /* बॉटम नेविगेशन */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(0, 4, 10, 0.98); border-top: 1.5px solid var(--border-neon);
            display: flex; justify-content: space-around; padding: 5px 2px;
        }
        .nav-tab { color: var(--text-sub); text-decoration: none; font-size: 7px; text-align: center; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 1px; }
        .nav-tab.active, .nav-tab:hover { color: var(--neon-green); }

        /* कॉल ओवरले */
        #callModal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 3, 8, 0.96); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; text-align: center;
        }
        .call-title { font-size: 13px; color: var(--neon-green); margin-bottom: 8px; font-weight: bold; }
        .call-status { font-size: 9px; color: var(--text-sub); margin-bottom: 25px; }
        .end-call-btn { background: var(--neon-pink); color: #fff; border: none; padding: 8px 18px; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 9px; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="chat-header">
        <div class="brand-title">
            <h2>⚡ ELECTRIC BODYGUARD</h2>
            <p>🛡️ FULLY DYNAMIC SPEECH-TO-TEXT AI CHAT</p>
        </div>
        <div class="header-icons">
            <span class="icon-btn" onclick="startCall('Audio Call')" title="Audio Call">📞</span>
            <span class="icon-btn" onclick="startCall('Video Call')" title="Video Call">📹</span>
            <span class="icon-btn" id="speakerBtn" onclick="toggleAudioGuide()" title="Audio Guide">🔊</span>
            <a href="index.html" class="icon-btn" title="Home">🏠</a>
        </div>
    </div>

    <div class="sub-bar">
        <div class="ai-status-badge">⚡ <span id="aiEngineStatus">Dynamic AI Engine Active</span></div>
        <select class="mode-switch" id="modeSwitcher" onchange="toggleNetworkMode()">
            <option value="auto">🌐 Auto (Hybrid Online/Offline)</option>
            <option value="offline">🔵 Strict Offline GGUF Mesh</option>
        </select>
    </div>

    <div class="chat-messages" id="chatBox">
        <div class="message received" id="welcomeText">Speech-to-Text & Auto-Detect AI Chat established. Speak or type seamlessly.</div>
    </div>

    <div class="chat-input-area">
        <input type="file" id="mediaFileInput" style="display: none;" accept="image/*,video/*,audio/*,.pdf" onchange="handleMediaUpload(event)">
        <button class="action-btn" onclick="document.getElementById('mediaFileInput').click()" title="Attach Media">📂</button>
        <button class="action-btn speech-type-btn" id="speechTypeBtn" onclick="startSpeechToTextTyping()" title="Speak to Type">🗣️</button>
        <button class="action-btn ai-magic-btn" onclick="aiAutoCorrectAndTranslate()" title="AI Auto-Detect & Polish">✨</button>
        <button class="action-btn record-btn" id="recordBtn" onclick="toggleVoiceRecording()" title="Voice Record Note">🎙️</button>
        <input type="text" class="chat-input" id="msgInput" placeholder="बोलें या टाइप करें (Auto-Detect)..." onkeypress="handleKey(event)">
        <button class="send-btn" id="sendBtnText" onclick="sendMessage()">Send</button>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-tab"><span>🏠</span><span>Home</span></a>
        <a href="studio.html" class="nav-tab"><span>🎛️</span><span>Studio</span></a>
        <a href="pay.html" class="nav-tab"><span>💳</span><span>Pay OS</span></a>
        <a href="feed-biz.html" class="nav-tab"><span>📰</span><span>Feeds</span></a>
        <a href="chat.html" class="nav-tab active"><span>💬</span><span>Chat</span></a>
    </div>

    <div id="callModal">
        <div class="call-title" id="callTypeTitle">Secure Call</div>
        <div class="call-status" id="callStatusText">Establishing encrypted P2P audio/video stream...</div>
        <button class="end-call-btn" onclick="endCall()">End Call ❌</button>
    </div>
</div><script>
    const badWords = ["abuse", "badword", "gaali", "faltu", "stupid", "गली", "बेकार"];
    let isSpeaking = false;
    let db;
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    const request = indexedDB.open("ElectricBodyguardDB", 2);
    request.onsuccess = function(event) {
        db = event.target.result;
        loadChatHistory();
    };
    request.onupgradeneeded = function(event) {
        db = event.target.result;
        if (!db.objectStoreNames.contains("secureChat")) {
            db.createObjectStore("secureChat", { keyPath: "id" });
        }
    };

    function sanitizeInput(input) {
        if (!input) return "";
        return input.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, "")
                    .replace(/[<>'"]/g, "")
                    .trim();
    }

    // बोलकर सीधे टाइप करने वाला फंक्शन (Speech-to-Text Typing)
    function startSpeechToTextTyping() {
        let btn = document.getElementById('speechTypeBtn');
        if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN'; // हिंदी, भोजपुरी या स्थानीय भाषा सपोर्ट के लिए
            
            recognition.onstart = function() {
                btn.classList.add('listening');
                speakText("बोलिए, मैं सुन रहा हूँ...");
            };

            recognition.onresult = function(event) {
                let spokenText = event.results[0][0].transcript;
                document.getElementById('msgInput').value = sanitizeInput(spokenText);
                btn.classList.remove('listening');
            };

            recognition.onerror = function() {
                btn.classList.remove('listening');
                alert("⚠️ स्पीच रिकग्निशन में दिक्कत आई। कृपया दोबारा प्रयास करें।");
            };

            recognition.onend = function() {
                btn.classList.remove('listening');
            };

            recognition.start();
        } else {
            alert("⚠️ आपका ब्राउज़र स्पीच रिकग्निशन सपोर्ट नहीं करता है।");
        }
    }

    function dynamicDetectAndTranslate(text) {
        let lower = text.toLowerCase();
        let detectedLang = "Hindi / General";
        let translatedOutput = text;

        if (/[\u4e00-\u9fa5]/.test(text)) {
            detectedLang = "Chinese (Mandarin)";
            translatedOutput = `[Translated to Local]: ${text} (AI Bridge Verified)`;
        } else if (lower.includes('kaise') || lower.includes('ba') || lower.includes('tani')) {
            detectedLang = "Bhojpuri Dialect";
            translatedOutput = `[भोजपुरी AI Sync]: ${text}`;
        } else if (lower.includes('sat sri akal') || lower.includes('ki haal')) {
            detectedLang = "Punjabi";
            translatedOutput = `[ਪੰਜਾਬੀ AI Sync]: ${text}`;
        } else if (/^[a-zA-Z\s]+$/.test(text)) {
            detectedLang = "English";
            translatedOutput = `[English AI Sync]: ${text}`;
        } else {
            detectedLang = "Hindi";
            translatedOutput = `[हिन्दी AI Sync]: ${text}`;
        }

        return { detectedLang, translatedOutput };
    }

    function aiAutoCorrectAndTranslate() {
        let input = document.getElementById('msgInput');
        let text = input.value.trim();
        if(!text) {
            alert("⚠️ कृपया पहले कुछ बोलें या टाइप करें!");
            return;
        }
        let result = dynamicDetectAndTranslate(text);
        input.value = result.translatedOutput;
        speakText(`भाषा पहचानी गई: ${result.detectedLang}. संदेश अपडेट हो गया है।`);
    }

    async function toggleVoiceRecording() {
        let recBtn = document.getElementById('recordBtn');
        if(!isRecording) {
            try {
                let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                mediaRecorder.onstop = () => {
                    let audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    let reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = function() {
                        let base64Audio = reader.result;
                        let msgObj = { id: "MSG-" + Date.now(), sender: "You", type: "audio", content: base64Audio, timestamp: Date.now() };
                        saveMessageToDB(msgObj);
                        appendMessageUI("message sent", base64Audio, "audio");
                        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
                    };
                };

                mediaRecorder.start();
                isRecording = true;
                recBtn.classList.add('recording');
                recBtn.innerText = "⏹️";
                speakText("वॉयस रिकॉर्डिंग शुरू हो गई है।");
            } catch(err) {
                alert("⚠️ माइक्रोफोन की अनुमति नहीं मिली!");
            }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            recBtn.classList.remove('recording');
            recBtn.innerText = "🎙️";
            speakText("वॉयस नोट सुरक्षित कर लिया गया है।");
        }
    }

    function sendMessage() {
        let input = document.getElementById('msgInput');
        let text = sanitizeInput(input.value);
        if(text === "") return;

        let chatBox = document.getElementById('chatBox');
        let lowerText = text.toLowerCase();
        let isViolating = badWords.some(word => lowerText.includes(word));

        if(isViolating) {
            let warnDiv = document.createElement('div');
            warnDiv.className = 'warning-msg';
            warnDiv.innerText = "⚠️ Sanitizer Alert: Restricted language blocked.";
            chatBox.appendChild(warnDiv);
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;
            return;
        }

        let aiAnalysis = dynamicDetectAndTranslate(text);
        let finalMsg = aiAnalysis.translatedOutput;

        let msgObj = { id: "MSG-" + Date.now(), sender: "You", type: "text", content: finalMsg, lang: aiAnalysis.detectedLang, timestamp: Date.now() };
        saveMessageToDB(msgObj);

        appendMessageUI("message sent", finalMsg, "text", aiAnalysis.detectedLang);
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        setTimeout(() => {
            let replyText = "🔵 [Offline GGUF / Online Hybrid]: आपका संदेश मिल गया है और डायनेमिक एआई इंजन द्वारा सिंक हो चुका है।";
            let replyObj = { id: "MSG-" + (Date.now() + 1), sender: "AI Ustaad", type: "text", content: replyText, lang: "Auto", timestamp: Date.now() };
            saveMessageToDB(replyObj);
            appendMessageUI("message received", replyText, "text", "Auto-Sync");
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 900);
    }

    function handleMediaUpload(event) {
        let file = event.target.files[0];
        if(!file) return;

        let reader = new FileReader();
        reader.onload = function(e) {
            let fileData = e.target.result;
            let fileType = file.type.startsWith('image') ? 'image' : (file.type.startsWith('video') ? 'video' : 'file');
            
            let msgObj = { id: "MSG-" + Date.now(), sender: "You", type: fileType, content: fileData, fileName: file.name, timestamp: Date.now() };
            saveMessageToDB(msgObj);

            appendMessageUI("message sent", fileData, fileType);
            document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
        };
        reader.readAsDataURL(file);
    }

    function appendMessageUI(className, content, type, langInfo = "") {
        let chatBox = document.getElementById('chatBox');
        let msgDiv = document.createElement('div');
        msgDiv.className = className;

        if(type === 'image') {
            let img = document.createElement('img');
            img.src = content;
            msgDiv.appendChild(img);
        } else if(type === 'video') {
            let vid = document.createElement('video');
            vid.src = content;
            vid.controls = true;
            msgDiv.appendChild(vid);
        } else if(type === 'audio') {
            let aud = document.createElement('audio');
            aud.src = content;
            aud.controls = true;
            msgDiv.appendChild(aud);
        } else {
            msgDiv.innerText = content;
            if(langInfo) {
                let tagSpan = document.createElement('span');
                tagSpan.className = 'dynamic-ai-tag';
                tagSpan.innerText = `⚡ Detected: [${langInfo}]`;
                msgDiv.appendChild(tagSpan);
            }
        }

        chatBox.appendChild(msgDiv);
    }

    function saveMessageToDB(msgObj) {
        if(!db || !db.objectStoreNames.contains("secureChat")) return;
        let tx = db.transaction(["secureChat"], "readwrite");
        let store = tx.objectStore("secureChat");
        store.put(msgObj);
    }

    function loadChatHistory() {
        if(!db || !db.objectStoreNames.contains("secureChat")) return;
        let tx = db.transaction(["secureChat"], "readonly");
        let store = tx.objectStore("secureChat");
        let req = store.getAll();

        req.onsuccess = function(e) {
            let messages = e.target.result;
            if(messages && messages.length > 0) {
                messages.sort((a, b) => a.timestamp - b.timestamp);
                messages.forEach(m => {
                    let cls = m.sender === "You" ? "message sent" : "message received";
                    appendMessageUI(cls, m.content, m.type || 'text', m.lang || '');
                });
                let chatBox = document.getElementById('chatBox');
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        };
    }

    function handleKey(e) {
        if(e.key === 'Enter') sendMessage();
    }

    function startCall(type) {
        document.getElementById('callTypeTitle').innerText = "Electric Bodyguard " + type;
        document.getElementById('callStatusText').innerText = "Establishing encrypted GGUF P2P audio/video stream...";
        document.getElementById('callModal').style.display = 'flex';
    }

    function endCall() {
        document.getElementById('callModal').style.display = 'none';
    }

    function toggleNetworkMode() {
        let mode = document.getElementById('modeSwitcher').value;
        let statusBadge = document.getElementById('aiEngineStatus');
        if(mode === 'offline') {
            statusBadge.innerText = "Strict Offline GGUF Mesh Active";
            speakText("स्ट्रिक्ट ऑफलाइन मोड सक्रिय कर दिया गया है।");
        } else {
            statusBadge.innerText = "Dynamic AI Engine Active";
            speakText("हाइब्रिड ऑनलाइन-ऑफलाइन मोड सक्रिय है।");
        }
    }

    function toggleAudioGuide() {
        let speakerBtn = document.getElementById('speakerBtn');
        if ('speechSynthesis' in window) {
            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                speakerBtn.innerText = "🔊";
                return;
            }
            let utterance = new SpeechSynthesisUtterance("इलेक्ट्रिक बॉडीगार्ड डायनेमिक एआई चैट ओ एस। बोलकर टाइप करने की सुविधा सक्रिय है।");
            utterance.lang = 'hi-IN';
            utterance.onend = () => { isSpeaking = false; speakerBtn.innerText = "🔊"; };
            isSpeaking = true;
            speakerBtn.innerText = "🔇";
            window.speechSynthesis.speak(utterance);
        }
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN';
            window.speechSynthesis.speak(utterance);
        }
    }
</script>
</body>
</html>
