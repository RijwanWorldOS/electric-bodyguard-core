<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Bodyguard - Unbreakable Secure Portal</title>
    <style>
        :root {
            --bg-device: #010308;
            --panel-bg: #050a14;
            --card-bg: #091122;
            --border-glow: rgba(0, 243, 255, 0.6);
            --text-main: #e0f7fa;
            --accent-primary: #00f3ff;
            --accent-secondary: #0077ff;
            --text-muted: #8098bc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-device);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            padding: 10px;
        }

        .phone-frame {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 94vh;
            background: var(--panel-bg);
            border: 2px solid var(--accent-primary);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden; /* फ्रेम से बाहर कुछ भी न जाने देने के लिए */
        }

        .app-wrapper {
            flex: 1;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            position: relative;
        }

        .app-wrapper::-webkit-scrollbar {
            width: 4px;
        }
        .app-wrapper::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 10px;
        }

        .premium-header {
            background: linear-gradient(135deg, rgba(0,102,255,0.2), rgba(0,243,255,0.1));
            border: 1px solid var(--accent-primary);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.25);
        }

        .electric-logo {
            font-size: 22px;
            margin-bottom: 2px;
        }

        .header-title {
            font-size: 13px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .voice-helper-banner {
            background: rgba(0, 243, 255, 0.08);
            border-left: 3px solid var(--accent-primary);
            padding: 8px 10px;
            font-size: 13px;
            color: #b2ebf2;
            border-radius: 0 6px 6px 0;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-field, .select-field {
            background: rgba(2, 5, 11, 0.95);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 6px;
            color: #fff;
            padding: 10px 12px;
            font-size: 13px;
            outline: none;
            width: 100%;
            z-index: 2;
        }

        .input-field:focus, .select-field:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }

        .action-btn {
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
            color: #010308;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            text-align: center;
            width: 100%;
            margin-top: 5px;
        }

        .terminal-footer {
            display: flex;
            justify-content: space-around;
            background: #010308;
            padding: 10px;
            border-top: 1px dashed rgba(0, 243, 255, 0.3);
        }

        .terminal-footer a {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="app-wrapper">
            <!-- Header -->
            <div class="premium-header">
                <div class="electric-logo">⚡ 🛡️</div>
                <div class="header-title">ELECTRIC BODYGUARD</div>
            </div>

            <!-- Voice Helper Banner -->
            <div class="voice-helper-banner">
                <span>🎤 वॉइस फुटप्रिंट पिन...</span>
            </div>

            <!-- 1. Name -->
            <div class="input-group">
                <label>1. आपका पूरा नाम (OPERATOR NAME)</label>
                <input type="text" class="input-field" placeholder="अपना पूरा नाम दर्ज करें">
            </div>

            <!-- 2. Auto Node ID -->
            <div class="input-group">
                <label>2. ऑटो-जेनेरेटेड सिक्यॉर नोड आईडी</label>
                <input type="text" class="input-field" value="EB-NODE-617531" readonly>
            </div>

            <!-- 3. Voice Pin -->
            <div class="input-group">
                <label>3. 4-अंकों का सिक्यॉर वॉइस पिन</label>
                <input type="text" class="input-field" value="VPIN-2961" readonly>
            </div>

            <!-- DROPDOWN 1: Security Class -->
            <div class="input-group">
                <label>4. सुरक्षा श्रेणी (SECURITY CLASS)</label>
                <select class="select-field">
                    <option>Lower Class Node (सिलवर बैज) - Free</option>
                    <option>Middle Class Node (गोल्ड बैज) - Free</option>
                    <option>Business Class Node (बिजनेस बैज) - Paid</option>
                    <option>VIP Secure Node (क्राउन बैज) - Paid</option>
                </select>
            </div>

            <!-- 5. Mobile Number -->
            <div class="input-group">
                <label>5. आपका मोबाइल नंबर (PRIMARY PHONE)</label>
                <input type="text" class="input-field" placeholder="10-अंकों का मुख्य मोबाइल नंबर">
            </div>

            <!-- DROPDOWN 2: Blood Group -->
            <div class="input-group">
                <label>6. ब्लड ग्रुप (BLOOD GROUP)</label>
                <select class="select-field">
                    <option>पता नहीं / बाद में अपडेट करें</option>
                    <option>A Positive (A+)</option>
                    <option>A Negative (A-)</option>
                    <option>B Positive (B+)</option>
                    <option>B Negative (B-)</option>
                    <option>O Positive (O+)</option>
                    <option>O Negative (O-)</option>
                </select>
            </div>

            <!-- DROPDOWN 3: Medical & Allergy Status -->
            <div class="input-group">
                <label>7. क्रिटिकल मेडिकल स्टेटस व एलर्जी नोट्स</label>
                <select class="select-field">
                    <option>सामान्य स्थिति / कोई गंभीर समस्या नहीं</option>
                    <option>हार्ट या ब्लड प्रेशर की समस्या</option>
                    <option>गंभीर एलर्जी (दवा या खाद्य पदार्थ)</option>
                    <option>अन्य विशेष मेडिकल निर्देश</option>
                </select>
            </div>

            <!-- Action Button -->
            <button type="button" class="action-btn">सुरक्षित करें और प्रोफाइल पर चलें</button>
        </div>

        <!-- Footer -->
        <div class="terminal-footer">
            <a href="#">रजिस्टर</a>
            <a href="#">प्रोफाइल</a>
        </div>
    </div>
</body>
</html>

    <script>
    // ==========================================
    // 1. FIREBASE INITIALIZATION (तेरा ओरिजिनल सेटअप)
    // ==========================================
    const firebaseConfig = { 
        apiKey: "AIzaSyAT13EhtnIOLCK17KPLwPhw_GJotsBNiA", 
        databaseURL: "https://vendorawaaz-4a0a5-default-rtdb.firebaseio.com/" 
    };
    
    if (!firebase.apps.length) { 
        firebase.initializeApp(firebaseConfig); 
    }
    
    // डेटाबेस का रेफ़रंस ताकि आगे काम आए
    const db = firebase.database();


    // ==========================================
    // 2. ELECTRIC BODYGUARD - UNIFIED SECURE CORE LOGIC
    // ==========================================

    document.addEventListener('DOMContentLoaded', () => {
        // ऑटोमैटिक रैंडम नोड आईडी और वॉयस पिन जनरेट करना
        const nodeIdField = document.getElementById('reg_node_id');
        const voicePinField = document.getElementById('reg_voice_pin');
        
        if (nodeIdField && !nodeIdField.value) {
            let randomId = 'EB-NODE-' + Math.floor(100000 + Math.random() * 900000);
            nodeIdField.value = randomId;
        }
        
        if (voicePinField && !voicePinField.value) {
            let randomVoicePin = 'VPIN-' + Math.floor(1000 + Math.random() * 9000);
            voicePinField.value = randomVoicePin;
        }

        // पेज लोड होने के 1 सेकंड बाद वेलकम वॉयस चलाना
        setTimeout(() => {
            playWelcomeVoice();
        }, 1000);

        // ऑटोमैटिक मल्टी-लैंग्वेज फोकस-बेस्ड वॉयस गाइडेंस
        const inputs = document.querySelectorAll('input, select');
        const userLang = navigator.language || 'hi-IN';
        const isEnglish = userLang.startsWith('en');

        inputs.forEach(element => {
            element.addEventListener('focus', () => {
                const fieldId = element.id;
                let guideText = "";

                if (isEnglish) {
                    if (fieldId === 'reg_name') guideText = "Type your full name here.";
                    else if (fieldId === 'reg_node_id') guideText = "This is your automatic secure node ID.";
                    else if (fieldId === 'reg_voice_pin') guideText = "This is your 4-digit secure voice PIN.";
                     else if (fieldId === 'reg_class') guideText = "Choose your security class and tier.";
                    else if (fieldId === 'reg_phone') guideText = "Enter your primary mobile number here.";
                    else if (fieldId === 'reg_blood') guideText = "Select your blood group.";
                    else if (fieldId === 'reg_medical') guideText = "Select your critical medical condition for emergency responders.";
                    else if (fieldId === 'reg_medical_notes') guideText = "Enter any special medical notes or prescription details.";
                    else if (fieldId.startsWith('g')) guideText = "Enter the SOS emergency mobile number of a trusted contact.";
                } else {
                    if (fieldId === 'reg_name') guideText = "यहाँ अपना पूरा नाम टाइप करें।";
                    else if (fieldId === 'reg_node_id') guideText = "यह आपकी ऑटोमैटिक नोड आईडी है।";
                    else if (fieldId === 'reg_voice_pin') guideText = "यह आपका चार अंकों का सिक्योर वॉइस पिन है।";
                    else if (fieldId === 'reg_class') guideText = "अपनी सुरक्षा श्रेणी और टियर चुनें।";
                    else if (fieldId === 'reg_phone') guideText = "यहाँ अपना मुख्य मोबाइल नंबर दर्ज करें।";
                    else if (fieldId === 'reg_blood') guideText = "अपना ब्लड ग्रुप चुनें।";
                    else if (fieldId === 'reg_medical') guideText = "अपनी क्रिटिकल मेडिकल कंडीशन चुनें। संकट के समय डॉक्टर के काम आएगी।";
                    else if (fieldId === 'reg_medical_notes') guideText = "यहाँ डॉक्टर के लिए कोई विशेष निर्देश या जरूरी दवा की जानकारी लिखें।";
                    else if (fieldId.startsWith('g')) guideText = "यहाँ अपने परिवार या किसी भरोसेमंद सदस्य का एसओएस इमरजेंसी मोबाइल नंबर दर्ज करें।";
                }

                if (guideText && 'speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    let speech = new SpeechSynthesisUtterance(guideText);
                    speech.lang = isEnglish ? 'en-US' : 'hi-IN';
                    speech.rate = 0.95;
                    window.speechSynthesis.speak(speech);
                }
            });
        });
    });

    // वेलकम वॉयस फ़ंक्शन
    function playWelcomeVoice(customLang = null) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let userLang = customLang || navigator.language || 'hi-IN';
            let welcomeText = "";

            if (userLang.startsWith('en')) {
                welcomeText = "Welcome to the world of Electric Bodyguard. Starting today, your security is our priority.";
                userLang = 'en-US';
            } else {
                welcomeText = "इलेक्ट्रिक बॉडीगार्ड की दुनिया में आपका स्वागत है। आज से आपकी सुरक्षा की जिम्मेदारी अब हमारी है।";
                userLang = 'hi-IN';
            }

            let speech = new SpeechSynthesisUtterance(welcomeText);
            speech.lang = userLang;
            speech.rate = 0.95;
            window.speechSynthesis.speak(speech);
        }
    }

    // डायरेक्ट कांटेक्ट पिकर फ़ंक्शन
    async function pickContact(fieldId) {
        if ('contacts' in navigator && 'select' in navigator.contacts) {
            try {
                const contacts = await navigator.contacts.select(['tel'], { multiple: false });
                if (contacts.length > 0 && contacts[0].tel.length > 0) {
                    document.getElementById(fieldId).value = contacts[0].tel[0];
                }
            } catch (ex) {
                alert("⚠️ कांटेक्ट चुनने में असमर्थ, कृपया नंबर टाइप कर लें।");
            }
        } else {
            alert("💡 भाई, आपके ब्राउज़र में डायरेक्ट कांटेक्ट पिकर उपलब्ध नहीं है। आप सीधे नंबर टाइप कर सकते हैं।");
        }
    }

    // बायोमेट्रिक वॉयस रिकॉर्डिंग फ़ंक्शन
    let recordedVoiceBlob = null;

    function startVoiceBiometricRecording() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert("❌ आपका ब्राउज़र वॉइस रिकॉर्डिंग सपोर्ट नहीं करता है।");
            return;
        }

        let statusText = document.getElementById('voiceStatus');
        if (statusText) {
            statusText.innerText = "🎙️ बोलिए... अपना 4 अंकों का पिन और नाम बताएं (रिकॉर्डिंग जारी है)...";
            statusText.style.color = "#00ff66";
        }

        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            let mediaRecorder = new MediaRecorder(stream);
            let audioChunks = [];

            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                recordedVoiceBlob = new Blob(audioChunks, { type: 'audio/webm' });
                let reader = new FileReader();
                reader.readAsDataURL(recordedVoiceBlob);
                reader.onloadend = function () {
                    let base64Audio = reader.result;
                    localStorage.setItem('eb_voice_biometric_sample', base64Audio);
                    if (statusText) {
                        statusText.innerText = "✅ आवाज़ का बायोमेट्रिक सैंपल सफलतापूर्वक दर्ज हो गया है!";
                        statusText.style.color = "#00ffff";
                    }
                };
            };

            mediaRecorder.start();

            setTimeout(() => {
                mediaRecorder.stop();
                stream.getTracks().forEach(track => track.stop());
            }, 4000);

        }).catch(error => {
            alert("❌ माइक्रोफोन की अनुमति नहीं मिली। कृपया अनुमति दें!");
            if (statusText) {
                statusText.innerText = "❌ माइक की अनुमति आवश्यक है!";
                statusText.style.color = "#ff0055";
            }
        });
    }

    // 100% ऑफलाइन-फर्स्ट यूजर नोड रजिस्ट्रेशन और डेटा सेविंग
    function registerUserNode() {
        try {
            let name = document.getElementById('reg_name').value.trim();
            let nodeId = document.getElementById('reg_node_id').value.trim();
            let voicePin = document.getElementById('reg_voice_pin').value.trim();
            let secClass = document.getElementById('reg_class').value;
            let phone = document.getElementById('reg_phone').value.trim();
            let blood = document.getElementById('reg_blood').value;
            let medical = document.getElementById('reg_medical').value.trim();
            let medicalNotes = document.getElementById('reg_medical_notes') ? document.getElementById('reg_medical_notes').value.trim() : "Normal";
            
            let g1 = document.getElementById('g1') ? document.getElementById('g1').value.trim() : 'N/A';
            let g2 = document.getElementById('g2') ? document.getElementById('g2').value.trim() : 'N/A';
            let g3 = document.getElementById('g3') ? document.getElementById('g3').value.trim() : 'N/A';
            let g4 = document.getElementById('g4') ? document.getElementById('g4').value.trim() : 'N/A';

            // बेसिक वैलिडेशन
            if (!name || !phone) {
                alert("⚠️ भाई, अपना नाम और मुख्य मोबाइल नंबर ज़रूर भरें!");
                document.getElementById('reg_name').focus();
                return;
            }

            let voiceSample = localStorage.getItem('eb_voice_biometric_sample');
            if (!voiceSample) {
                alert("⚠️ सुरक्षा चेकपॉइंट: कृपया 'आवाज़ रिकॉर्ड करें' बटन दबाकर अपना बायोमेट्रिक वॉइस सैंपल दर्ज करें!");
                return;
            }

            let profileData = {
                nodeId: nodeId,
                operatorName: name,
                voicePin: voicePin,
                securityClass: secClass,
                phone: phone,
                bloodGroup: blood,
                medicalCondition: medical || 'None',
                medicalNotes: medicalNotes,
                sosGuards: [g1, g2, g3, g4],
                sosTriggerCount: 0,
                voiceBiometricSample: voiceSample,
                isCompleted: true,
                createdAt: new Date().toISOString()
            };

            // 1. सबसे पहले लोकल डिवाइस में 100% सुरक्षित सेव करें (Offline-First)
            localStorage.setItem('eb_user_profile', JSON.stringify(profileData));
            localStorage.setItem('eb_is_registered', 'true');

            // 2. बैकग्राउंड में सेल्फ-हीलिंग सिंक (इंटरनेट न होने पर भी ऐप क्रैश नहीं होगा)
            try {
                if (typeof db !== 'undefined' && db) {
                    let safeKey = nodeId.replace(/[.#$[\]]/g, '_');
                    db.ref('security_nodes/' + safeKey).set(profileData).then(() => {
                        console.log("✅ डेटा क्लाउड सर्वर पर सिंक हो गया है।");
                    }).catch((netError) => {
                        console.log("ℹ️ ऑफलाइन मोड: इंटरनेट उपलब्ध नहीं है, डेटा लोकल डिवाइस में सुरक्षित है।");
                    });
                }
            } catch (syncErr) {
                console.log("ℹ️ क्लाउड सिंक बायपास किया गया (ऑफलाइन एक्टिव)।");
            }

            alert("🛡️ चेकपॉइंट सफल: आपका डेटा लोकल डिवाइस में सुरक्षित रूप से दर्ज हो गया है।");
            
            // प्रोफाइल पेज पर रीडायरेक्ट करना
            window.location.href = "profile.html";

        } catch (err) {
            console.error("Critical Execution Error:", err);
            alert("⚠️ तकनीकी दिक्कत आई, लेकिन आपका लोकल डेटा सुरक्षित है। कृपया पुनः प्रयास करें।");
        }
    }
</script>
</body>
