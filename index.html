<head>

    <style>
        :root { 
            --bg-device: #010308; 
            --panel-bg: #050a14; 
            --card-bg: #091122; 
            --border-glow: rgba(0, 243, 255, 0.6); 
            --text-main: #e0f7fa; 
            --text-muted: #546e7a; 
            --accent-primary: #00f3ff; 
            --accent-secondary: #0066ff; 
            --badge-bg: rgba(0,243,255,0.1);
            --alert-color: #ff3300;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        
        body { 
            background-color: var(--bg-device); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            padding: 0; 
        }
        
        .phone-frame {
            width: 100%; 
            max-width: 400px; 
            height: 100vh;
            max-height: 700px;
            background: var(--panel-bg);
            border: 2px solid var(--accent-primary); 
            border-radius: 12px;
            box-shadow: 0 0 25px var(--border-glow);
            display: flex; 
            flex-direction: column; 
            position: relative;
            overflow: hidden;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border-bottom: 1px solid var(--accent-primary);
            padding: 6px 10px;
            flex-shrink: 0;
        }

        .header-logo-box { display: flex; align-items: center; gap: 6px; }
        .mini-avatar-container {
            width: 28px; height: 28px; border-radius: 50%; position: relative;
            display: flex; justify-content: center; align-items: center;
        }
        .mini-avatar-container::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 50%; border: 1.5px solid var(--accent-primary);
            animation: energyWave 2s infinite linear; pointer-events: none;
        }
        @keyframes energyWave {
            0% { transform: scale(1); opacity: 1; }
            70% { transform: scale(1.15); opacity: 0.2; }
            100% { transform: scale(1.25); opacity: 0; }
        }
        .mini-avatar-inner {
            width: 100%; height: 100%; border-radius: 50%;
            border: 1.5px solid var(--accent-primary); overflow: hidden;
            background: var(--bg-device);
        }
        .mini-avatar-inner img { width: 100%; height: 100%; object-fit: cover; }
        .brand-title { font-size: 9px; font-weight: 900; color: #fff; text-shadow: 0 0 5px var(--accent-primary); letter-spacing: 1px; }

        .network-badge {
            background: var(--badge-bg); border: 1px solid var(--accent-primary);
            padding: 2px 6px; border-radius: 10px; font-size: 7px; font-weight: 900;
            color: var(--accent-primary); display: flex; align-items: center; gap: 4px;
        }
        .net-dot { width: 5px; height: 5px; background: #00ff44; border-radius: 50%; box-shadow: 0 0 4px #00ff44; }
        .net-dot.offline { background: var(--alert-color); box-shadow: 0 0 4px var(--alert-color); }

        .app-wrapper {
            flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto;
        }
        .app-wrapper::-webkit-scrollbar { width: 3px; }
        .app-wrapper::-webkit-scrollbar-thumb { background: var(--accent-primary); border-radius: 10px; }

        .ai-guide-banner {
            background: linear-gradient(135deg, rgba(0,243,255,0.15), var(--card-bg));
            border: 1px solid var(--accent-primary); border-radius: 6px; padding: 5px 8px;
            font-size: 7px; color: var(--text-main); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
        }
        .ai-guide-btn {
            background: var(--accent-primary); color: #010308; border: none; padding: 2px 5px;
            border-radius: 3px; font-weight: 900; font-size: 6.5px; cursor: pointer; text-transform: uppercase;
        }

        .main-action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; flex-shrink: 0; }
        .action-tile {
            background: var(--card-bg); border: 1px solid var(--accent-primary); border-radius: 6px;
            padding: 8px 4px; text-align: center; color: var(--text-main);
            font-size: 7px; font-weight: 900; text-transform: uppercase;
            display: flex; flex-direction: column; gap: 2px; cursor: pointer; text-decoration: none;
        }
        .action-tile:active { transform: scale(0.95); background: var(--accent-primary); color: #010308; }
        .action-tile.sos { border-color: var(--alert-color); background: rgba(255, 51, 0, 0.1); color: #ffaa99; }

        .geo-filter-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; flex-shrink: 0; }
        .geo-btn {
            background: var(--bg-device); border: 1px solid var(--accent-primary); border-radius: 5px;
            padding: 5px 2px; font-size: 7.5px; font-weight: 900; color: var(--text-main); text-align: center; cursor: pointer; text-transform: uppercase;
        }
        .geo-btn.active { background: var(--accent-primary); color: #010308; }

        .upload-action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; flex-shrink: 0; }
        .upload-btn-card {
            background: linear-gradient(135deg, var(--card-bg), var(--panel-bg)); border: 1px dashed var(--accent-primary);
            border-radius: 6px; padding: 6px; text-align: center; font-size: 7.5px; font-weight: 900; color: var(--accent-primary); cursor: pointer; text-transform: uppercase;
        }

        .vault-container {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
            padding: 8px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; min-height: 120px;
        }
        .vault-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 4px; }
        .vault-title { font-size: 8px; font-weight: 900; color: var(--accent-primary); text-transform: uppercase; }
        .vault-status { font-size: 6.5px; color: #00ff44; font-weight: 800; background: rgba(0,255,68,0.1); padding: 2px 5px; border-radius: 3px; }
        .vault-rules { font-size: 6.5px; color: var(--text-muted); font-weight: 800; }

        .feed-stream { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; max-height: 140px; }
        
        .feed-card {
            background: var(--bg-device); border: 1px solid var(--accent-primary); border-radius: 5px; padding: 6px; font-size: 7.5px; display: flex; flex-direction: column; gap: 4px;
        }
        .feed-card-header { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 6px; font-weight: 900; }
        .feed-card-body { color: var(--text-main); font-weight: 700; line-height: 1.2; word-break: break-word; }
        
        .poll-box {
            background: rgba(0, 243, 255, 0.05); border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 4px; padding: 4px; display: flex; flex-direction: column; gap: 3px;
        }
        .poll-question { font-size: 7px; font-weight: 900; color: var(--accent-primary); }
        .poll-options { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
        .poll-btn {
            background: var(--card-bg); border: 1px solid var(--accent-primary); color: var(--text-main);
            padding: 3px; font-size: 6.5px; font-weight: 900; border-radius: 3px; cursor: pointer; text-align: center;
        }

        .shield-actions-bar {
            display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(0,243,255,0.2); padding-top: 4px; margin-top: 2px;
        }
        .shield-react-btn {
            background: var(--badge-bg); border: 1px solid var(--accent-primary); color: var(--accent-primary);
            padding: 2px 5px; border-radius: 3px; font-size: 6.5px; font-weight: 900; cursor: pointer; display: flex; align-items: center; gap: 2px;
        }

        .terminal-footer { 
            display: flex; justify-content: space-around; background: #010308; padding: 10px 6px 14px 6px; border-top: 1px solid var(--accent-primary); flex-shrink: 0; z-index: 10;
        }
        .terminal-footer a { color: var(--text-muted); font-size: 18px; text-decoration: none; text-align: center; transition: 0.2s; }
        .terminal-footer a.active { color: var(--accent-primary); text-shadow: 0 0 8px var(--accent-primary); transform: scale(1.15); }
    </style>
</head>
<body onload="initAutonomousSystem()">

            <!-- मुख्य नेविगेशन ग्रिड - सभी फाइलें आपस में लिंक कर दी गई हैं -->

    </div><script>
        const firebaseConfig = { apiKey: "AIzaSyAT13EhtnIOLCk17KPLwPhw_GJotsBNiA", databaseURL: "https://vendorawaaz-4a0a5-default-rtdb.firebaseio.com/", projectId: "vendorawaaz-4a0a5", storageBucket: "vendorawaaz-4a0a5.appspot.com" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        const GEMINI_API_KEY = "AIzaSyAT13EhtnIOLCk17KPLwPhw_GJotsBNiA";
        const LOCAL_STORAGE_KEY = 'eb_autonomous_vault_cache';
        let currentLang = localStorage.getItem('eb_lang') || 'hi';

        const translations = {
            hi: {
                syncActive: "सिंक सक्रिय",
                offlineMode: "ऑफ़लाइन मोड",
                aiBanner: "🤖 AI सेल्फ-लर्निंग कोर सक्रिय!",
                vaultStatus: "सुरक्षित",
                vaultRules: "ऑटोनॉमस क्राइम एनालिटिक्स सक्रिय।",
                localVaultEmpty: "लोकल वॉल्ट खाली है।"
            },
            en: {
                syncActive: "SYNC ACTIVE",
                offlineMode: "OFFLINE MODE",
                aiBanner: "🤖 AI Self-Learning Core Active!",
                vaultStatus: "SECURE",
                vaultRules: "Autonomous Crime Analytics Active.",
                localVaultEmpty: "Local Vault is empty."
            }
        };

        function initAutonomousSystem() {
            let savedAvatar = localStorage.getItem('eb_user_avatar');
            if(savedAvatar) { document.getElementById('header_avatar').src = savedAvatar; }

            window.addEventListener('online', updateNetworkStatus);
            window.addEventListener('offline', updateNetworkStatus);
            updateNetworkStatus();
            applyLanguageTexts();

            loadAutonomousFeed('local');
        }

        function toggleLanguage() {
            currentLang = currentLang === 'hi' ? 'en' : 'hi';
            localStorage.setItem('eb_lang', currentLang);
            applyLanguageTexts();
            speakGuide(currentLang === 'hi' ? "भाषा हिंदी कर दी गई है।" : "Language changed to English.");
        }

        function applyLanguageTexts() {
            let t = translations[currentLang];
            document.getElementById('net_text').innerText = navigator.onLine ? t.syncActive : t.offlineMode;
            document.getElementById('ai_guide_text').innerText = t.aiBanner;
            document.getElementById('vault_mode_status').innerText = t.vaultStatus;
            document.getElementById('vault_rules_text').innerText = t.vaultRules;
        }

        function updateNetworkStatus() {
            const dot = document.getElementById('net_dot');
            let t = translations[currentLang];

            if (navigator.onLine) {
                dot.classList.remove('offline');
                document.getElementById('net_text').innerText = t.syncActive;
                syncLocalToServer();
            } else {
                dot.classList.add('offline');
                document.getElementById('net_text').innerText = t.offlineMode;
            }
        }

        function speakGuide(message) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let speech = new SpeechSynthesisUtterance(message);
                speech.lang = currentLang === 'hi' ? 'hi-IN' : 'en-US';
                window.speechSynthesis.speak(speech);
            }
        }

        function setGeoScope(scope, element) {
            document.querySelectorAll('.geo-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            let titleMap = {
                'local': '🛡️ Rizwan Autonomous Vault (Local)',
                'national': '🇮🇳 National Intelligence Core',
                'intl': '🌐 International Threat Vault',
                'global': '🌍 Global Autonomous Shield'
            };
            document.getElementById('vault_title_text').innerText = titleMap[scope];
            loadAutonomousFeed(scope);
        }

        async function refineTextWithGemini(rawUserInput) {
            if (!navigator.onLine) {
                return "Autonomous Legal Draft [Offline Mode]: " + rawUserInput;
            }

            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            const promptText = `आप एक विशेषज्ञ लीगल और ऑफिशियल ड्राफ्टिंग असिस्टेंट हैं। नीचे एक यूज़र द्वारा लोकल, आम बोलचाल या टूटी-फूटी भाषा में दर्ज की गई घटना का विवरण है। इसे पढ़ें, मूल भावना को समझें, और इसे एक स्पष्ट, गंभीर, औपचारिक (Formal) और लीगल ड्राफ्ट रिपोर्ट में बदलें। भाषा वही रखें जिसमें यूजर सहज हो, पर टोन एकदम पेशेवर और कानूनी होनी चाहिए।
            
            यूज़र का इनपुट: "${rawUserInput}"
            
            केवल रिफाइंड और लीगल ड्राफ्ट टेक्स्ट आउटपुट दें:`;

            try {
                let response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
                });

                let data = await response.json();
                return data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || rawUserInput;
            } catch (error) {
                return rawUserInput;
            }
        }

        async function handleAutonomousUpload(event, type) {
            let file = event.target.files[0];
            if(file) {
                let reader = new FileReader();
                reader.onload = async function(e) {
                    let mediaUrl = e.target.result;
                    let rawText = prompt(currentLang === 'hi' ? "कृपया अपनी बात या घटना दर्ज करें:" : "Please enter your report:");
                    
                    if(rawText !== null && rawText.trim() !== "") {
                        alert(currentLang === 'hi' ? "⏳ Gemini AI आपके इनपुट को लीगल ड्राफ्ट में बदल रहा है..." : "⏳ Gemini AI is formatting into a legal draft...");

                        let finalizedLegalText = await refineTextWithGemini(rawText);

                        let postData = {
                            id: 'post_' + Date.now(),
                            type: type,
                            text: finalizedLegalText,
                            media: mediaUrl,
                            timestamp: new Date().toLocaleString(),
                            author: 'Autonomous Operator',
                            shieldCount: 0,
                            poll: { yes: 0, no: 0 },
                            synced: false
                        };

                        savePostLocally(postData);

                        if (navigator.onLine) {
                            db.ref('global_vault_posts/' + postData.id).set(postData).then(() => {
                                markPostSynced(postData.id);
                            });
                        }

                        alert(currentLang === 'hi' ? "✅ लीगल ड्राफ्ट सफलतापूर्व वॉल्ट में सुरक्षित हो गया!" : "✅ Legal draft saved successfully!");
                        loadAutonomousFeed('local');
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function savePostLocally(post) {
            let localPosts = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY) || '[]');
            localPosts.unshift(post);
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(localPosts));
        }

        function syncLocalToServer() {
            let localPosts = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY) || '[]');
            localPosts.forEach(post => {
                if (!post.synced) {
                    db.ref('global_vault_posts/' + post.id).set(post).then(() => {
                        markPostSynced(post.id);
                    });
                }
            });
        }

        function markPostSynced(postId) {
            let localPosts = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY) || '[]');
            localPosts = localPosts.map(p => { if (p.id === postId) p.synced = true; return p; });
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(localPosts));
        }

        function verifyShield(postId, currentCount) {
            let newCount = (currentCount || 0) + 1;
            if (navigator.onLine) {
                db.ref('global_vault_posts/' + postId).update({ shieldCount: newCount });
            } else {
                updateLocalPostField(postId, { shieldCount: newCount });
            }
            speakGuide("शील्ड काउंटर अपडेट किया गया।");
        }

        function votePoll(postId, option, currentPoll) {
            let poll = currentPoll || { yes: 0, no: 0 };
            if (option === 'yes') { poll.yes += 1; } else { poll.no += 1; }
            if (navigator.onLine) {
                db.ref('global_vault_posts/' + postId).update({ poll: poll });
            } else {
                updateLocalPostField(postId, { poll: poll });
            }
            speakGuide("मतदान सफलतापूर्व दर्ज हो गया है।");
        }

        function updateLocalPostField(postId, updates) {
            let localPosts = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY) || '[]');
            localPosts = localPosts.map(p => { if (p.id === postId) { Object.assign(p, updates); } return p; });
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(localPosts));
            loadAutonomousFeed('local');
        }

        function loadAutonomousFeed(scope) {
            const stream = document.getElementById('global_feed_stream');

            if (!navigator.onLine) {
                renderFeedFromLocal();
                return;
            }

            db.ref('global_vault_posts').on('value', (snapshot) => {
                let contentHTML = "";
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        let postId = childSnapshot.key;
                        let p = childSnapshot.val();
                        contentHTML += buildPostHTML(postId, p, p.shieldCount || 0, p.poll || { yes: 0, no: 0 });
                    });
                } else {
                    contentHTML = `<div class="feed-card"><div class="feed-card-body">${translations[currentLang].localVaultEmpty}</div></div>`;
                }
                stream.innerHTML = contentHTML;
            }, (error) => {
                renderFeedFromLocal();
            });
        }

        function renderFeedFromLocal() {
            const stream = document.getElementById('global_feed_stream');
            let localPosts = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY) || '[]');
            let contentHTML = "";

            if (localPosts.length > 0) {
                localPosts.forEach(p => {
                    contentHTML += buildPostHTML(p.id, p, p.shieldCount || 0, p.poll || { yes: 0, no: 0 });
                });
            } else {
                contentHTML = `<div class="feed-card"><div class="feed-card-body">${translations[currentLang].localVaultEmpty}</div></div>`;
            }
            stream.innerHTML = contentHTML;
        }

        function buildPostHTML(postId, p, shieldCount, poll) {
            let safePollJson = JSON.stringify(poll).replace(/"/g, '&quot;');
            return `
                <div class="feed-card">
                    <div class="feed-card-header">
                        <span>[${p.author}]</span>
                        <span>${p.timestamp}</span>
                    </div>
                    <div class="feed-card-body">${p.text}</div>
                    ${p.media ? `<img src="${p.media}" style="width:100%; max-height:100px; object-fit:cover; border-radius:4px; margin-top:4px;">` : ''}
                    
                    <div class="poll-box">
                        <div class="poll-question">📊 Assessment: Authentic?</div>
                        <div class="poll-options">
                            <button class="poll-btn" onclick="votePoll('${postId}', 'yes', ${safePollJson})">✅ Yes (${poll.yes})</button>
                            <button class="poll-btn" onclick="votePoll('${postId}', 'no', ${safePollJson})">❌ Doubt (${poll.no})</button>
                        </div>
                    </div>

                    <div class="shield-actions-bar">
                        <button class="shield-react-btn" onclick="verifyShield('${postId}', ${shieldCount})">
                            🛡️ Shield (${shieldCount})
                        </button>
                        <span style="font-size:6px; color:var(--text-muted);">Core</span>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
